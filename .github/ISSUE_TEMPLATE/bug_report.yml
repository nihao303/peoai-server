name: 缺陷报告
description: 报告一个可复现的问题（请勿粘贴密钥或真实用户内容）
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认已移除 API Key、密码、请求正文与任何个人信息。
        安全问题请改用 [SECURITY.md](../blob/main/SECURITY.md) 中的私下渠道。
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 发生了什么？你期望发生什么？
      placeholder: 调用 /v1/chat/completions 后客户端一直挂起，队列里也看不到请求。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动服务 ...
        2. 发送请求 ...
        3. 观察 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 1.0.0（或 commit hash）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - OpenAI 协议
        - Anthropic 协议
        - Gemini 协议
        - Ollama 协议
        - 控制台前端
        - 队列 / 流式
        - 认证 / 密钥
        - 部署（systemd / Nginx）
        - 文档
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Ubuntu 22.04 / Python 3.11 / Nginx 1.24
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已移除所有密钥与个人信息
          required: true
        - label: 我已搜索过现有 Issue
          required: true
