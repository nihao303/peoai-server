name: 功能建议
description: 提出一个新能力或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述场景，而不是直接给方案。
      placeholder: 我的 Agent 会发送 Anthropic 的 document 块，目前会被拒绝 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 协议兼容
        - 控制台前端
        - 安全与限流
        - 部署与运维
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 与 Discussions
          required: true
