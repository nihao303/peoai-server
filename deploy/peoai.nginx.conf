# ============================================================
# PeoAI Server · Nginx 反向代理片段
# 把本文件内容放进站点 server { ... } 块中，或 include 进来。
# 访问 https://your-domain/peoai/ 即可打开控制台，
# 前端会自动把接口请求发往同源的 /peoai/ 前缀。
# ============================================================

# 规范尾斜杠，避免相对路径 404
location = /peoai {
    return 301 /peoai/;
}

location ^~ /peoai/ {
    # 注意末尾的 /：把 /peoai/xxx 重写为 /xxx 再转给后端
    proxy_pass http://127.0.0.1:5007/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";

    # ---- SSE / 长轮询关键配置：必须关闭缓冲 ----
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    # 真人作答可能很慢：读超时按需调大（默认 1 小时）
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_timeout 3600s;

    # 与 config.security.max_body_bytes 对齐
    client_max_body_size 16m;

    # 不要对 SSE 做 gzip
    gzip off;
    add_header X-Accel-Buffering no always;
}

# 可选：独立子域名方式（推荐生产环境）
