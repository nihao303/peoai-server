          ])
        ]),
        el('div', { class: 'reply-box' }, [
          el('textarea', {
            id: 'replyInput',
            placeholder: '输入要返回给客户端的内容…',
            spellcheck: 'false'
          }),
          el('div', { class: 'reply-meta' }, [
            el('span', { id: 'charCount', text: '0 字' }),
            el('span', { id: 'elapsedLine', text: '' })
          ])
        ]),
        el('div', { id: 'draftWrap' }),
        el('div', { class: 'actions' }, [
          el('button', { class: 'btn ghost', id: 'deltaBtn', type: 'button' }, [icon('bolt', 15), '发送回答片段']),
          el('button', { class: 'btn ghost', id: 'reasoningDeltaBtn', type: 'button' }, [icon('user', 15), '发送思考片段']),
          el('button', { class: 'btn primary', id: 'replyBtn', type: 'button' }, [icon('send', 15), '提交完成']),
          el('button', { class: 'btn ghost', id: 'claimBtn', type: 'button' }, [icon('user', 15), '认领']),
          el('button', { class: 'btn danger wide', id: 'rejectBtn', type: 'button' }, [icon('x', 15), '拒绝'])
        ]),
        el('div', { class: 'hint' }, [
          el('kbd', { text: 'Ctrl' }), ' + ', el('kbd', { text: 'Enter' }), ' 提交完成 · ',
          el('kbd', { text: 'Ctrl' }), ' + ', el('kbd', { text: 'Shift' }), ' + ', el('kbd', { text: 'Enter' }), ' 发送片段'
        ]),
        el('div', { id: 'callChips' }),
        el('div', { class: 'toolbox', id: 'toolbox' })
      ])
    ]);

    wrap.appendChild(queuePanel);
    wrap.appendChild(detailPanel);
    wrap.appendChild(composerPanel);
    root.appendChild(wrap);

    var searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function () {
      STORE.search = searchInput.value;
      renderQueue();
    });
    document.getElementById('replyInput').addEventListener('input', updateCharCount);
    document.getElementById('reasoningInput').addEventListener('input', updateCharCount);
    document.getElementById('deltaBtn').addEventListener('click', function () { sendDelta('text'); });
    document.getElementById('reasoningDeltaBtn').addEventListener('click', function () { sendDelta('reasoning'); });
    document.getElementById('replyBtn').addEventListener('click', sendReply);
    document.getElementById('claimBtn').addEventListener('click', claimJob);
    document.getElementById('rejectBtn').addEventListener('click', rejectJob);
    document.getElementById('replyInput').addEventListener('keydown', function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        if (event.shiftKey) sendDelta('text');
        else sendReply();
      }
    });
    startTick();
    return wrap;
  }

  /* ======================================================================
     队列
     ====================================================================== */
  var FILTERS = [
    { id: 'pending', label: '待处理' },
    { id: 'claimed', label: '进行中' },
    { id: 'all', label: '全部' },
    { id: 'done', label: '已完成' }
  ];

  function jobMatchesFilter(job, filter) {
    if (filter === 'all') return true;
    if (filter === 'pending') return job.status === 'pending';
    if (filter === 'claimed') return job.status === 'claimed';
    if (filter === 'done') return ['answered', 'rejected', 'expired', 'cancelled'].indexOf(job.status) >= 0;
    return true;
  }

  function filterCount(filter) {
    var count = 0;
    STORE.jobs.forEach(function (job) {
      if (jobMatchesFilter(job, filter)) count += 1;
    });
    return count;
  }

  function conversationMap(jobs) {
    var map = {};
    jobs.forEach(function (job) {
      var id = job.conversation_id || ('conv_' + job.id);
      if (!map[id]) {
        map[id] = { id: id, title: job.conversation_title || job.preview || job.id, jobs: [] };
      }
      map[id].jobs.push(job);
      if (job.conversation_title) map[id].title = job.conversation_title;
    });
    Object.keys(map).forEach(function (id) {
      var group = map[id];
      group.jobs.sort(function (a, b) { return a.created_at - b.created_at; });
      group.jobs.forEach(function (job, index) { job._turn = index + 1; });
      group.latest = group.jobs[group.jobs.length - 1];
      group.total = group.jobs.length;
      group.pending = group.jobs.filter(function (job) { return job.status === 'pending'; }).length;
      group.active = group.jobs.filter(function (job) {
        return job.status === 'pending' || job.status === 'claimed';
      }).length;
      group.models = [];
      group.jobs.forEach(function (job) {
        if (group.models.indexOf(job.model) < 0) group.models.push(job.model);
      });
    });
    return map;
  }

  function conversationIsOpen(group) {
    var manual = STORE.expandedConversations[group.id];
    if (typeof manual === 'boolean') return manual;
    if (group.jobs.some(function (job) { return job.id === STORE.selectedId; })) return true;
    return group.active > 0;
  }

  function requestRow(job) {
    var meta = statusMeta(job.status);
    var row = el('button', {
      class: 'req-row' + (job.id === STORE.selectedId ? ' is-active' : ''),
      type: 'button'
    }, [
      el('div', { class: 'req-top' }, [
        el('span', { class: 'req-turn', text: '#' + (job._turn || 1) }),
        el('span', { class: 'mini-badge ' + meta.cls, text: meta.label }),
        el('span', { class: 'req-model', text: job.model }),
        el('span', { class: 'req-time', text: fmtAge(job.age_seconds) })
      ]),
      el('div', { class: 'req-preview', text: job.preview }),
      el('div', { class: 'req-meta' }, [
        el('span', { class: 'mini-badge', text: protocolShort(job.protocol) }),
        job.stream ? el('span', { class: 'mini-badge blue' }, [icon('bolt', 11), '流式']) : null,
        job.image_count ? el('span', { class: 'mini-badge violet' }, [icon('image', 11), String(job.image_count)]) : null,
        job.tool_count ? el('span', { class: 'mini-badge' }, [icon('tool', 11), String(job.tool_count)]) : null
      ])
    ]);
    row.addEventListener('click', function (event) {
      event.stopPropagation();
      selectJob(job.id);
    });
    return row;
  }

  function renderQueue() {
    var listNode = document.getElementById('queueList');
    var filtersNode = document.getElementById('filters');
    if (!listNode || !filtersNode) return;

    clear(filtersNode);
    FILTERS.forEach(function (filter) {
      var chip = el('button', {
        class: 'chip' + (STORE.filter === filter.id ? ' is-active' : ''),
        type: 'button'
      }, [filter.label, el('span', { class: 'count', text: String(filterCount(filter.id)) })]);
      chip.addEventListener('click', function () {
        STORE.filter = filter.id;
        renderQueue();
      });
      filtersNode.appendChild(chip);
    });

    var countPill = document.getElementById('queueCount');
    if (countPill) {
      var pending = (STORE.stats && STORE.stats.pending) || 0;
      countPill.textContent = String(pending) + ' 待处理';
      countPill.className = 'pill ' + (pending ? 'amber' : '');
    }
    var footRight = document.getElementById('queueFootRight');
    if (footRight) {
      footRight.textContent = '平均 ' + ((STORE.stats && STORE.stats.avg_reply_seconds) || 0) + ' 秒';
    }

    var groups = conversationMap(STORE.jobs || []);
    var needle = (STORE.search || '').toLowerCase();
    var visibleGroups = [];
    Object.keys(groups).forEach(function (id) {
      var group = groups[id];
      var visibleJobs = group.jobs.filter(function (job) {
        if (!jobMatchesFilter(job, STORE.filter)) return false;
        if (!needle) return true;
        return (
          job.id + ' ' + job.model + ' ' + job.preview + ' ' + job.protocol + ' ' +
          (job.conversation_title || '')
        ).toLowerCase().indexOf(needle) >= 0;
      });
      if (!visibleJobs.length) return;
      group.visibleJobs = visibleJobs;
      visibleGroups.push(group);
    });
    visibleGroups.sort(function (a, b) { return b.latest.created_at - a.latest.created_at; });

    clear(listNode);
    if (!visibleGroups.length) {
      listNode.appendChild(el('div', { class: 'empty' }, [
        icon('queue', 34),
        el('div', { text: needle ? '没有匹配的请求' : '这里还很安静，等待新的调用' })
      ]));
      return;
    }

    visibleGroups.forEach(function (group) {
      if (group.total <= 1) {
        var single = requestRow(group.visibleJobs[0] || group.latest);
        single.classList.add('conv-single');
        listNode.appendChild(single);
        return;
      }
      var open = conversationIsOpen(group);
      if (needle) open = true;
      var latestMeta = statusMeta(group.latest.status);
      var head = el('button', { class: 'conv-head', type: 'button' }, [
        el('span', { class: 'conv-chevron' }, [icon('chevron', 14)]),
        el('div', { class: 'conv-headtext' }, [
          el('div', { class: 'conv-title', text: group.title, title: group.title }),
          el('div', { class: 'conv-meta' }, [
            el('span', { text: group.total + ' 次请求' }),
            el('span', { text: ' · ' + group.models.join(' / ') }),
            group.pending ? el('span', { class: 'mini-badge amber', text: '待回复 ' + group.pending }) : null,
            group.active && !group.pending ? el('span', { class: 'mini-badge primary', text: '进行中' }) : null
          ])
        ]),
        el('span', { class: 'mini-badge ' + latestMeta.cls, text: latestMeta.label })
      ]);
      head.addEventListener('click', function () {
        STORE.expandedConversations[group.id] = !open;
        renderQueue();
      });

      var card = el('div', { class: 'conv' + (open ? ' is-open' : '') }, [head]);
      if (open) {
        var rows = el('div', { class: 'conv-requests' });
        group.visibleJobs.slice().sort(function (a, b) { return b.created_at - a.created_at; })
          .forEach(function (job) { rows.appendChild(requestRow(job)); });
        card.appendChild(rows);
      }
      listNode.appendChild(card);
    });
  }

  /* ======================================================================
     详情面板
     ====================================================================== */
  function renderDetail() {
    var head = document.getElementById('detailHead');
    var tabs = document.getElementById('detailTabs');
    var body = document.getElementById('detailBody');
    if (!head || !tabs || !body) return;

    if (!STORE.job) {
      UI.detailJobId = null;
      UI.detailTab = null;
      clear(head);
      clear(tabs);
      head.appendChild(el('div', { class: 'detail-title' }, [
        el('div', {}, [
          el('h2', { text: '请求详情' }),
          el('div', { class: 'detail-id', text: '从左侧队列选择一个请求' })
        ])
      ]));
      clear(body);
      body.appendChild(el('div', { class: 'empty', style: 'padding:60px 20px' }, [
        icon('layers', 46),
        el('div', { text: '对方正在等待。选择一个请求，理解上下文后作答。' })
      ]));
      return;
    }

    var job = STORE.job;
    var same = UI.detailJobId === job.id && UI.detailTab === STORE.tab;
    if (!same) {
      UI.detailJobId = job.id;
      UI.detailTab = STORE.tab;
      renderDetailHead(head, job);
      renderDetailTabs(tabs, job);
      renderDetailBody(body, job);
    } else {
      renderDetailHead(head, job);
      renderDetailTabs(tabs, job);
      updateDetailDynamic(job);
    }
  }

  function conversationSiblings(job) {
    var cid = job.conversation_id;
    var list = (STORE.jobs || []).filter(function (item) {
      return (item.conversation_id || ('conv_' + item.id)) === cid;
    });
    return list.sort(function (a, b) { return a.created_at - b.created_at; });
  }

  function renderDetailHead(head, job) {
    clear(head);
    var meta = statusMeta(job.status);
    var siblings = conversationSiblings(job);
    var turn = 0;
    siblings.forEach(function (item, index) {
      if (item.id === job.id) turn = index + 1;
    });
    var title = job.conversation_title || job.preview || job.id;
    head.appendChild(el('div', { class: 'detail-title' }, [
      el('div', { style: 'min-width:0;flex:1' }, [
        el('h2', { text: title, title: title }),
        el('div', {
          class: 'detail-id',
          text: '第 ' + (turn || 1) + ' / ' + Math.max(1, siblings.length) + ' 次请求 · ' + job.id
        })
      ]),
      el('span', { class: 'pill ' + meta.cls, id: 'detailStatus', text: meta.label })
    ]));

    var badges = el('div', { class: 'detail-badges' });
    badges.appendChild(el('span', { class: 'mini-badge' }, [icon('layers', 11), job.model]));
    badges.appendChild(el('span', { class: 'mini-badge', text: protocolShort(job.protocol) }));
    if (job.stream) badges.appendChild(el('span', { class: 'mini-badge blue' }, [icon('bolt', 11), '流式']));
    if (job.image_count) badges.appendChild(el('span', { class: 'mini-badge violet' }, [icon('image', 11), '图片 ' + job.image_count]));
    if (job.tool_count) badges.appendChild(el('span', { class: 'mini-badge' }, [icon('tool', 11), '工具 ' + job.tool_count]));
    badges.appendChild(el('span', { class: 'mini-badge' }, [icon('key', 11), job.api_key || 'anonymous']));
    if (job.client_ip) badges.appendChild(el('span', { class: 'mini-badge' }, [icon('terminal', 11), job.client_ip]));
    badges.appendChild(el('span', { class: 'mini-badge' }, [icon('clock', 11), fmtClock(job.created_at)]));
    if (job.typing) badges.appendChild(el('span', { class: 'mini-badge amber', text: '对方正在输入…' }));
    head.appendChild(badges);

    if (siblings.length > 1) {
      var switcher = el('select', {
        class: 'select',
        id: 'jobSwitcher',
        style: 'margin-top:10px;max-width:100%'
      });
      siblings.forEach(function (item, index) {
        var option = el('option', { value: item.id }, [
          '#' + (index + 1) + ' · ' + fmtClock(item.created_at) + ' · ' + statusMeta(item.status).label + ' · ' + item.model
        ]);
        if (item.id === job.id) option.selected = true;
        switcher.appendChild(option);
      });
      switcher.addEventListener('change', function () { selectJob(switcher.value); });
      head.appendChild(switcher);
    }

    var warnings = (job.meta && job.meta.warnings) || [];
    warnings.forEach(function (message) {
      head.appendChild(el('div', { class: 'notice', style: 'margin:10px 0 0' }, [
        icon('alert', 16),
        el('div', { text: message })
      ]));
    });
  }

  function renderDetailTabs(tabs, job) {
    clear(tabs);
    var entries = [
      { id: 'chat', label: '对话', count: job.messages.length },
      { id: 'tools', label: '工具', count: (job.tools || []).length },
      { id: 'raw', label: '原始请求', count: 0 }
    ];
    entries.forEach(function (entry) {
      var tab = el('button', {
        class: 'dtab' + (STORE.tab === entry.id ? ' is-active' : ''),
        type: 'button'
      }, [entry.label + (entry.count ? ' ' + entry.count : '')]);
      tab.addEventListener('click', function () {
        STORE.tab = entry.id;
        UI.detailTab = null;
        renderDetail();
      });
      tabs.appendChild(tab);
    });
  }

  function renderDetailBody(body, job) {
    clear(body);
    if (STORE.tab === 'tools') {
      renderToolsTab(body, job);
      return;
    }
    if (STORE.tab === 'raw') {
      renderRawTab(body, job);
      return;
    }
    renderChatTab(body, job);
  }

  function renderChatTab(body, job) {
    body.appendChild(el('div', { class: 'section' }, [
      el('div', { class: 'section-title', text: '对话上下文' })
    ]));
    var list = el('div', {});
    (job.messages || []).forEach(function (message) {
      list.appendChild(renderMessage(message));
    });
    body.appendChild(list);

    body.appendChild(el('div', { class: 'section', id: 'replySection' }, [
      el('div', { class: 'section-title', text: '当前回复' })
    ]));
    renderReplySection(job);
    updateDetailParams(job);
  }

  function renderReplySection(job) {
    var section = document.getElementById('replySection');
    if (!section) return;
    var existing = section.querySelector('.reply-current');
    if (existing) section.removeChild(existing);

    var wrap = el('div', { class: 'reply-current' });
    var reply = job.reply || {};
    if (reply.reasoning) {
      var thinking = el('details', { class: 'thinking-block', open: 'open' });
      thinking.appendChild(el('summary', { text: '思考过程 · ' + reply.reasoning.length + ' 字' }));
      thinking.appendChild(el('div', { class: 'thinking-content', text: reply.reasoning }));
      wrap.appendChild(thinking);
    }
    if (reply.text) {
      wrap.appendChild(el('div', { class: 'msg' }, [
        el('div', { class: 'msg-head' }, [
          el('span', { class: 'role-badge assistant', text: 'assistant' }),
          el('span', { class: 'msg-name', text: '已发送 ' + reply.text.length + ' 字 · ' + (reply.deltas || 0) + ' 个片段' })
        ]),
        renderRich(reply.text)
      ]));
    } else if (reply.reasoning) {
      wrap.appendChild(el('div', { class: 'hint', text: '已发送思考内容，尚未发送正文。' }));
    } else if (job.status === 'pending') {
      wrap.appendChild(el('div', { class: 'notice info' }, [
        icon('clock', 16),
        el('div', { text: '对方仍在等待。可以先发送片段让流式客户端看到进度，最后再提交完成。' })
      ]));
    } else if (job.status === 'claimed') {
      wrap.appendChild(el('div', { class: 'hint', text: '已认领，等待你提交内容…' }));
    } else {
      wrap.appendChild(el('div', { class: 'hint', text: '没有文本回复。' }));
    }

    if ((reply.tool_calls || []).length) {
      reply.tool_calls.forEach(function (call) {
        wrap.appendChild(renderCallCard(call, '工具调用'));
      });
    }
    if (job.status === 'rejected' || job.status === 'expired' || job.status === 'cancelled') {
      wrap.appendChild(el('div', { class: 'notice danger' }, [
        icon('alert', 16),
        el('div', { text: '该请求已结束：' + (job.finish_reason || job.status) })
      ]));
    }
    section.appendChild(wrap);
  }

  function updateDetailDynamic(job) {
    var status = document.getElementById('detailStatus');
    var meta = statusMeta(job.status);
    if (status) {
      status.className = 'pill ' + meta.cls;
      status.textContent = meta.label;
    }
    renderReplySection(job);
  }

  function renderMessage(message) {
    var role = message.role || 'user';
    var node = el('div', { class: 'msg is-' + role });
    var head = el('div', { class: 'msg-head' }, [
      el('span', { class: 'role-badge ' + role, text: role })
    ]);
    if (message.name) head.appendChild(el('span', { class: 'msg-name', text: message.name }));
    if (message.tool_call_id) head.appendChild(el('span', { class: 'msg-name', text: 'tool_call_id: ' + message.tool_call_id }));
    if (message.text) head.appendChild(el('span', { class: 'msg-name', text: message.text.length + ' 字' }));
    node.appendChild(head);

    if (message.text) node.appendChild(renderRich(message.text));
    if ((message.images || []).length) node.appendChild(renderMediaGrid(message.images));
    if ((message.tool_calls || []).length) {
      message.tool_calls.forEach(function (call) {
        node.appendChild(renderCallCard(call, '历史工具调用'));
      });
    }
    if (!message.text && !(message.images || []).length && !(message.tool_calls || []).length) {
      node.appendChild(el('div', { class: 'msg-empty', text: '(空消息)' }));
    }
    return node;
  }

  function renderCallCard(call, label) {
    var argumentsValue = call.arguments_json;
    var argsText = argumentsValue !== undefined && argumentsValue !== null
      ? fmtJSON(argumentsValue)
      : text(call.arguments || '{}');
    return el('div', { class: 'tool-card' }, [
      el('div', { class: 'tool-card-head' }, [
        el('span', { class: 'tool-name', text: call.name || '(未命名)' }),
        el('span', { class: 'mini-badge blue', text: label }),
        call.id ? el('span', { class: 'mini-badge', text: call.id }) : null
      ]),
      el('pre', { class: 'code-block', text: argsText })
    ]);
  }

  /* ======================================================================
     富文本（全部走 DOM 节点，不拼 innerHTML）
     ====================================================================== */
  function renderRich(value) {
    var source = text(value);
    var fence = BT + BT + BT;
    var wrap = el('div', { class: 'rich' });
    var last = 0;
    var index = source.indexOf(fence);
    while (index >= 0) {
      var close = source.indexOf(fence, index + fence.length);
      if (close < 0) break;
      if (index > last) appendParagraphs(wrap, source.slice(last, index));
      var body = source.slice(index + fence.length, close);
      var newline = body.indexOf('\n');
      var info = newline >= 0 ? body.slice(0, newline).trim() : body.trim();
      var codeText = newline >= 0 ? body.slice(newline + 1) : '';
      if (info && !/^[a-zA-Z0-9_+-]*$/.test(info)) {
        codeText = body;
      }
      var pre = el('pre', { class: 'code-block' });
      pre.appendChild(el('code', { text: codeText.replace(/\n$/, '') }));
      wrap.appendChild(pre);
      last = close + fence.length;
      index = source.indexOf(fence, last);
    }
    if (last < source.length) appendParagraphs(wrap, source.slice(last));
    if (!wrap.childNodes.length) wrap.appendChild(el('div', { class: 'msg-empty', text: '(空内容)' }));
    return wrap;
  }

  function appendParagraphs(host, raw) {
    raw.split(/\n{2,}/).forEach(function (chunk) {
      if (!chunk.trim()) return;
      var p = el('p');
      var lines = chunk.split('\n');
      lines.forEach(function (line, index) {
        if (index) p.appendChild(el('br'));
        appendInline(p, line);
      });
      host.appendChild(p);
    });
  }

  function appendInline(host, line) {
    var pattern = new RegExp(
      '(' + BT + '[^' + BT + ']+' + BT + '|\\*\\*[^*]+\\*\\*|https?:\\/\\/[^\\s<>]+)',
      'g'
    );
    var last = 0;
    var match;
    while ((match = pattern.exec(line))) {
      if (match.index > last) host.appendChild(document.createTextNode(line.slice(last, match.index)));
      var token = match[0];
      if (token.charAt(0) === BT) {
        host.appendChild(el('code', { text: token.slice(1, -1) }));
      } else if (token.indexOf('**') === 0) {
        host.appendChild(el('strong', { text: token.slice(2, -2) }));
      } else {
        var cleaned = token.replace(/[.,;:!?)\]"'<>]+$/, '');
        var trailing = token.slice(cleaned.length);
        host.appendChild(el('a', {
          href: cleaned,
          target: '_blank',
          rel: 'noopener noreferrer nofollow',
          text: cleaned
        }));
        if (trailing) host.appendChild(document.createTextNode(trailing));
      }
      last = match.index + match[0].length;
    }
    if (last < line.length) host.appendChild(document.createTextNode(line.slice(last)));
  }

  /* ======================================================================
     图片
     ====================================================================== */
  function renderMediaGrid(images) {
    var grid = el('div', { class: 'media-grid' });
    images.forEach(function (media) { grid.appendChild(renderMedia(media)); });
    return grid;
  }

  function remoteImagesAllowed() {
    if (STORE.remoteImages) return true;
    var security = (STORE.config && STORE.config.security) || {};
    return !!security.allow_remote_images;
  }

  function mediaImage(src, media) {
    var img = el('img', {
      src: src,
      alt: media.name || '请求中的图片',
      loading: 'lazy',
      referrerpolicy: 'no-referrer',
      decoding: 'async'
    });
    img.addEventListener('click', function () { openLightbox(src, media); });
    img.addEventListener('error', function () {
      img.style.display = 'none';
      var parent = img.parentNode;
      if (parent) parent.appendChild(el('div', { class: 'media-error', text: '图片加载失败' }));
    });
    return img;
  }

  function mountMediaImage(fig, src, media) {
    clear(fig);
    fig.classList.remove('is-remote');
    fig.appendChild(mediaImage(src, media));
    fig.appendChild(el('figcaption', {}, [
      el('span', { text: (media.mime || '图片') }),
      el('span', { text: media.bytes ? fmtBytes(media.bytes) : '—' })
    ]));
  }

  function renderMedia(media) {
    var fig = el('figure', { class: 'media' });
    var isRemote = media.kind === 'remote';
    var src = isRemote ? media.url : media.data_url;

    if (isRemote && !remoteImagesAllowed()) {
      fig.classList.add('is-remote');
      var load = el('button', { class: 'btn ghost small media-load', type: 'button' }, [icon('image', 14), '加载图片']);
      load.addEventListener('click', function () {
        load.disabled = true;
        mountMediaImage(fig, src, media);
      });
      fig.appendChild(el('div', { class: 'media-link' }, [
        el('a', { href: src, target: '_blank', rel: 'noopener noreferrer nofollow', text: media.name || src })
      ]));
      fig.appendChild(el('div', { class: 'media-actions' }, [load]));
      fig.appendChild(el('div', { class: 'hint', text: '远端图片默认不自动加载，点击「加载图片」后才会请求图片服务器。' }));
      return fig;
    }
    if (!src) {
      fig.appendChild(el('div', {
        class: 'media-error',
        text: media.sha256 ? '图片未持久化：历史请求仅保留摘要' : '图片数据缺失'
      }));
      return fig;
    }

    mountMediaImage(fig, src, media);
    return fig;
  }

  function openLightbox(src, media) {
    var overlay = document.getElementById('lightbox');
    var img = document.getElementById('lightboxImg');
    var meta = document.getElementById('lightboxMeta');
    if (!overlay || !img) return;
    img.src = src;
    img.alt = (media && media.name) || '';
    meta.textContent = [
      media && media.mime ? media.mime : '',
      media && media.bytes ? fmtBytes(media.bytes) : '',
      media && media.sha256 ? 'sha256:' + media.sha256 : ''
    ].filter(Boolean).join(' · ');
    overlay.classList.add('is-open');
  }

  function closeLightbox() {
    var overlay = document.getElementById('lightbox');
    var img = document.getElementById('lightboxImg');
    if (overlay) overlay.classList.remove('is-open');
    if (img) img.removeAttribute('src');
  }

  /* ======================================================================
     工具解析与展示
     ====================================================================== */
  function schemaEntries(schema) {
    var properties = (schema && schema.properties) || {};
    var required = (schema && schema.required) || [];
    return Object.keys(properties).map(function (name) {
      var prop = properties[name] || {};
      return {
        name: name,
        prop: prop,
        required: required.indexOf(name) >= 0
      };
    });
  }

  function typeLabel(prop) {
    if (!prop) return 'any';
    var type = prop.type;
    if (Array.isArray(type)) return type.join(' | ');
    if (!type && prop.enum) return 'enum';
    if (!type && prop.anyOf) return 'any';
    return type || 'any';
  }

  function renderToolsTab(body, job) {
    var tools = job.tools || [];
    if (!tools.length) {
      body.appendChild(el('div', { class: 'empty', style: 'padding:40px 20px' }, [
        icon('tool', 40),
        el('div', { text: '该请求没有携带工具定义。' })
      ]));
      return;
    }
    body.appendChild(el('div', { class: 'notice info' }, [
      icon('tool', 16),
      el('div', { text: '这些工具由调用方（Agent / SDK）传入，已解析为参数表。可以据此在作答区构造工具调用。' })
    ]));
    if (job.tool_choice) {
      body.appendChild(el('div', { class: 'section' }, [
        el('div', { class: 'section-title', text: '工具选择策略' }),
        el('pre', { class: 'code-block', text: fmtJSON(job.tool_choice) })
      ]));
    }
    tools.forEach(function (tool) {
      body.appendChild(renderToolCard(tool));
    });
  }

  function renderToolCard(tool) {
    var card = el('div', { class: 'tool-card' });
    var entries = schemaEntries(tool.parameters);
    card.appendChild(el('div', { class: 'tool-card-head' }, [
      el('span', { class: 'tool-name', text: tool.name }),
      el('span', { class: 'mini-badge blue', text: tool.source || 'openai' }),
      el('span', { class: 'mini-badge', text: entries.length + ' 个参数' }),
      tool.strict ? el('span', { class: 'mini-badge green', text: 'strict' }) : null
    ]));
    if (tool.description) card.appendChild(el('div', { class: 'tool-desc', text: tool.description }));

    if (entries.length) {
      var table = el('table', { class: 'schema-table' });
      table.appendChild(el('thead', {}, [
        el('tr', {}, [
          el('th', { text: '参数' }),
          el('th', { text: '类型' }),
          el('th', { text: '说明' })
        ])
      ]));
      var tbody = el('tbody');
      entries.forEach(function (entry) {
        var typeCell = el('td', {}, [el('span', { class: 'type', text: typeLabel(entry.prop) })]);
        if (entry.prop.enum && entry.prop.enum.length) {
          var enumList = el('div', { class: 'enum-list' });
          entry.prop.enum.forEach(function (value) {
            enumList.appendChild(el('span', { text: String(value) }));
          });
          typeCell.appendChild(enumList);
        }
        tbody.appendChild(el('tr', {}, [
          el('td', {}, [
            el('span', { class: 'field', text: entry.name }),
            entry.required ? el('span', { class: 'req', text: ' *' }) : null
          ]),
          typeCell,
          el('td', { text: entry.prop.description || (entry.prop.items && entry.prop.items.description) || '—' })
        ]));
      });
      table.appendChild(tbody);
      card.appendChild(table);
    } else {
      card.appendChild(el('div', { class: 'hint', text: '该工具没有声明参数。' }));
    }

    var details = el('details', {});
    details.appendChild(el('summary', { text: '查看原始 JSON Schema' }));
    details.appendChild(el('pre', { class: 'code-block', text: fmtJSON(tool.parameters, 2) }));
    card.appendChild(details);
    return card;
  }

  /* ======================================================================
     原始请求 / 参数
     ====================================================================== */
  function renderRawTab(body, job) {
    var section = el('div', { class: 'section' }, [
      el('div', { class: 'section-title', text: '原始请求体' })
    ]);
    var copyBtn = el('button', { class: 'btn small ghost', type: 'button' }, [icon('copy', 14), '复制 JSON']);
    copyBtn.addEventListener('click', function () { copyText(fmtJSON(job.raw, 2)); });
    section.appendChild(el('div', { class: 'row-actions', style: 'margin:0 0 10px' }, [copyBtn]));
    section.appendChild(el('pre', { class: 'code-block', text: fmtJSON(job.raw || {}, 2) }));
    body.appendChild(section);

    body.appendChild(el('div', { class: 'section' }, [
      el('div', { class: 'section-title', text: '请求元信息' }),
      renderKV([
        ['协议', job.protocol],
        ['模型', job.model],
        ['请求模型', job.request_model],
        ['流式', job.stream ? '是' : '否'],
        ['API Key', job.api_key],
        ['客户端 IP', job.client_ip || '—'],
        ['User-Agent', job.user_agent || '—'],
        ['创建时间', fmtClock(job.created_at)],
        ['完成时间', job.completed_at ? fmtClock(job.completed_at) : '—'],
        ['耗时', job.age_seconds + ' 秒']
      ])
    ]));

    body.appendChild(el('div', { class: 'section' }, [
      el('div', { class: 'section-title', text: '实时回复' }),
      el('pre', { class: 'code-block', text: fmtJSON({ text: job.reply && job.reply.text, tool_calls: job.reply && job.reply.tool_calls }, 2) })
    ]));

  function renderKV(pairs) {
    var grid = el('div', { class: 'kv-grid' });
    pairs.forEach(function (pair) {
      grid.appendChild(el('dl', { class: 'kv' }, [
        el('dt', { text: pair[0] }),
        el('dd', { text: pair[1] === null || pair[1] === undefined || pair[1] === '' ? '—' : String(pair[1]) })
      ]));
    });
    return grid;
  }

  var PARAM_ORDER = [
    'temperature', 'top_p', 'max_tokens', 'stop', 'tool_choice', 'response_format',
    'reasoning_effort', 'seed', 'presence_penalty', 'frequency_penalty', 'top_k',
    'num_predict', 'stopSequences', 'maxOutputTokens', 'candidateCount', 'stream_options'
  ];

  function formatParamValue(value) {
    if (value === null || value === undefined) return '—';
    if (typeof value === 'object') return fmtJSON(value, 0);
    if (typeof value === 'boolean') return value ? '是' : '否';
    return String(value);
  }

  function updateDetailParams(job) {
    var existing = document.getElementById('paramsSection');
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
    var params = job.params || {};
    var keys = PARAM_ORDER.filter(function (key) { return params[key] !== undefined; });
    Object.keys(params).forEach(function (key) {
      if (keys.indexOf(key) < 0) keys.push(key);
    });
    if (!keys.length) return;

    var section = el('div', { class: 'section', id: 'paramsSection' }, [
      el('div', { class: 'section-title', text: '模型参数' })
    ]);
    section.appendChild(renderKV(keys.map(function (key) {
      return [key, formatParamValue(params[key])];
    })));
    var body = document.getElementById('detailBody');
    if (body) body.appendChild(section);
  }

  /* ======================================================================
     作答区
     ====================================================================== */
  function isTerminalStatus(status) {
    return ['answered', 'rejected', 'expired', 'cancelled'].indexOf(status) >= 0;
  }

  function renderComposer() {
    var job = STORE.job;
    var input = document.getElementById('replyInput');
    var reasoningInput = document.getElementById('reasoningInput');
    var badge = document.getElementById('composerBadge');
    var sub = document.getElementById('composerSub');
    var jobLine = document.getElementById('composerJob');
    var deltaBtn = document.getElementById('deltaBtn');
    var reasoningDeltaBtn = document.getElementById('reasoningDeltaBtn');
    var replyBtn = document.getElementById('replyBtn');
    var claimBtn = document.getElementById('claimBtn');
    var rejectBtn = document.getElementById('rejectBtn');
    var toolbox = document.getElementById('toolbox');
    var draftWrap = document.getElementById('draftWrap');
    if (!input || !badge) return;

    if (!job) {
      sub.textContent = '选择左侧请求开始';
      badge.textContent = '空闲';
      badge.className = 'pill';
      jobLine.textContent = '';
      input.disabled = true;
      input.placeholder = '先选择一个请求…';
      if (reasoningInput) {
        reasoningInput.disabled = true;
        reasoningInput.placeholder = '先选择一个请求…';
      }
      [deltaBtn, reasoningDeltaBtn, replyBtn, claimBtn, rejectBtn].forEach(function (button) {
        if (button) button.disabled = true;
      });
      if (toolbox) toolbox.style.display = 'none';
      if (draftWrap) clear(draftWrap);
      renderCallChips();
      updateCharCount();
      return;
    }

    var terminal = isTerminalStatus(job.status);
    var meta = statusMeta(job.status);
    badge.textContent = meta.label;
    badge.className = 'pill ' + meta.cls;
    sub.textContent = job.model + ' · ' + protocolShort(job.protocol);

    clear(jobLine);
    jobLine.appendChild(el('span', { class: 'mini-badge', text: job.id }));
    jobLine.appendChild(el('span', { class: 'mini-badge ' + (job.status === 'pending' ? 'amber' : 'primary'), text: meta.label }));
    if (job.typing) jobLine.appendChild(el('span', { class: 'mini-badge amber', text: '对方正在输入…' }));

    input.disabled = terminal;
    input.placeholder = terminal
      ? '该请求已经结束，选择其他请求继续。'
      : '输入要返回给客户端的内容，支持 Markdown 代码块…';
    if (reasoningInput) {
      reasoningInput.disabled = terminal;
      reasoningInput.placeholder = terminal
        ? '该请求已经结束。'
        : '思考内容（可选）：会作为 reasoning_content / thinking / thought 发给客户端';
    }

    if (deltaBtn) deltaBtn.disabled = terminal;
    if (reasoningDeltaBtn) reasoningDeltaBtn.disabled = terminal;
    if (replyBtn) replyBtn.disabled = terminal;
    if (claimBtn) claimBtn.disabled = terminal || job.status !== 'pending';
    if (rejectBtn) {
      rejectBtn.disabled = terminal;
      rejectBtn.textContent = '';
      rejectBtn.appendChild(icon('x', 15));
      rejectBtn.appendChild(document.createTextNode(UI.rejectArmed ? '确认拒绝？' : '拒绝'));
    }

    if (toolbox) {
      var hasTools = (job.tools || []).length > 0 && !terminal;
      toolbox.style.display = hasTools ? '' : 'none';
      var signature = job.id + ':' + (job.tools || []).map(function (tool) { return tool.name; }).join(',');
      if (hasTools && (UI.composerJobId !== job.id || UI.toolSignature !== signature)) {
        UI.composerJobId = job.id;
        UI.toolSignature = signature;
        UI.ageBase = Number(job.age_seconds) || 0;
        UI.ageAt = Date.now();
        buildToolbox(toolbox, job);
      }
    }

    if (draftWrap) {
      clear(draftWrap);
      if (STORE.draftReasoning) {
        draftWrap.appendChild(el('div', { class: 'draft-preview reasoning-draft' }, [
          el('div', { style: 'font-size:10.5px;font-weight:800;color:var(--violet);margin-bottom:4px', text: '已流式发送 · 思考' }),
          el('div', { text: STORE.draftReasoning })
        ]));
      }
      if (STORE.draft) {
        draftWrap.appendChild(el('div', { class: 'draft-preview' }, [
          el('div', { style: 'font-size:10.5px;font-weight:800;color:var(--green);margin-bottom:4px', text: '已流式发送 · 回答' }),
          el('div', { text: STORE.draft })
        ]));
      }
    }
    renderCallChips();
    updateCharCount();
  }

  function updateCharCount() {
    var input = document.getElementById('replyInput');
    var counter = document.getElementById('charCount');
    if (input && counter) {
      var total = (STORE.draft || '').length + (input.value || '').length;
      counter.textContent = String(total) + ' 字';
    }
    var reasoningInput = document.getElementById('reasoningInput');
    var reasoningCounter = document.getElementById('reasoningCount');
    if (reasoningInput && reasoningCounter) {
      var reasoningTotal = (STORE.draftReasoning || '').length + (reasoningInput.value || '').length;
      reasoningCounter.textContent = '思考 ' + String(reasoningTotal) + ' 字';
    }
  }

  function renderCallChips() {
    var host = document.getElementById('callChips');
    if (!host) return;
    clear(host);
    if (!STORE.toolCalls.length) return;
    var list = el('div', { class: 'call-chips' });
    list.appendChild(el('div', { class: 'hint', text: '本次回复将包含以下工具调用：' }));
    STORE.toolCalls.forEach(function (call, index) {
      var chip = el('div', { class: 'call-chip' }, [
        el('div', { class: 'call-body' }, [
          el('div', { class: 'call-name', text: call.name }),
          el('div', { class: 'call-args', text: fmtJSON(call.arguments, 0) })
        ])
      ]);
      var remove = el('button', { type: 'button', title: '移除该调用', 'aria-label': '移除该工具调用' }, [icon('trash', 14)]);
      remove.addEventListener('click', function () {
        STORE.toolCalls.splice(index, 1);
        renderCallChips();
        toast('已移除工具调用', 'info');
      });
      chip.appendChild(remove);
      list.appendChild(chip);
    });
    host.appendChild(list);

  /* ======================================================================
     工具调用构建器
     ====================================================================== */
  function buildToolbox(host, job) {
    clear(host);
    host.appendChild(el('h3', {}, [icon('tool', 14), '工具调用']));
    var picker = el('div', { class: 'tool-picker' });
    (job.tools || []).forEach(function (tool) {
      var option = el('button', {
        class: 'tool-option' + (STORE.activeTool === tool.name ? ' is-active' : ''),
        type: 'button'
      }, [tool.name]);
      option.addEventListener('click', function () {
        STORE.activeTool = STORE.activeTool === tool.name ? null : tool.name;
        buildToolbox(host, job);
      });
      picker.appendChild(option);
    });
    host.appendChild(picker);

    var formHost = el('div', { class: 'tool-form', id: 'toolFormHost' });
    host.appendChild(formHost);
    if (STORE.activeTool) {
      var tool = null;
      (job.tools || []).forEach(function (item) {
        if (item.name === STORE.activeTool) tool = item;
      });
      if (tool) openToolForm(formHost, tool);
    } else {
      formHost.appendChild(el('div', { class: 'hint', text: '选择上方工具，填好参数后加入回复。' }));
    }
  }

  function openToolForm(host, tool) {
    clear(host);
    var entries = schemaEntries(tool.parameters);
    var fields = [];
    var errorLine = el('div', { class: 'form-error' });

    if (!entries.length) {
      host.appendChild(el('div', { class: 'hint', text: '该工具没有参数，可直接加入回复。' }));
    }

    entries.forEach(function (entry) {
      var field = buildField(entry);
      fields.push(field);
      host.appendChild(field.node);
    });

    host.appendChild(errorLine);

    var submit = el('button', { class: 'btn primary small', type: 'button' }, [icon('plus', 14), '加入回复']);
    submit.addEventListener('click', function () {
      errorLine.textContent = '';
      var args = {};
      var failed = false;
      fields.forEach(function (field) {
        var result = readField(field);
        if (result.error) {
          failed = true;
          field.node.classList.add('has-error');
          var errorNode = field.node.querySelector('.form-error');
          if (errorNode) errorNode.textContent = result.error;
          return;
        }
        field.node.classList.remove('has-error');
        var errorNode2 = field.node.querySelector('.form-error');
        if (errorNode2) errorNode2.textContent = '';
        if (result.skip) return;
        args[field.entry.name] = result.value;
      });
      if (failed) {
        errorLine.textContent = '请修正标红的参数';
        return;
      }
      STORE.toolCalls.push({
        id: 'call_' + Math.random().toString(36).slice(2, 10),
        name: tool.name,
        arguments: args
      });
      renderCallChips();
      toast('已加入工具调用：' + tool.name, 'ok');
    });
    host.appendChild(submit);

    var preview = el('pre', { class: 'code-block', text: '{}', style: 'margin-top:10px' });
    host.appendChild(preview);
    function refreshPreview() {
      var args = {};
      fields.forEach(function (field) {
        var result = readField(field);
        if (!result.error && !result.skip) args[field.entry.name] = result.value;
      });
      preview.textContent = fmtJSON(args, 2);
    }
    fields.forEach(function (field) {
      field.node.addEventListener('input', refreshPreview);
      field.node.addEventListener('change', refreshPreview);
    });
    refreshPreview();
  }

  function buildField(entry) {
    var prop = entry.prop || {};
    var type = typeLabel(prop);
    var wrapper = el('div', { class: 'field' });
    var controlId = 'tf_' + entry.name.replace(/[^a-zA-Z0-9_-]/g, '_');
    wrapper.appendChild(el('label', { for: controlId }, [
      el('span', { text: entry.name }),
      el('span', { class: 'type', text: type }),
      entry.required ? el('span', { class: 'req-dot', text: '*' }) : null
    ]));

    var kind = 'text';
    var node = null;

    if (prop.enum && prop.enum.length) {
      kind = 'enum';
      node = el('select', { class: 'select', id: controlId });
      node.appendChild(el('option', { value: '', text: '请选择…' }));
      prop.enum.forEach(function (value) {
        node.appendChild(el('option', { value: String(value), text: String(value) }));
      });
    } else if (prop.type === 'boolean') {
      kind = 'boolean';
      var checkbox = el('input', { type: 'checkbox', id: controlId });
      var labelText = el('span', { text: 'false' });
      checkbox.addEventListener('change', function () {
        labelText.textContent = checkbox.checked ? 'true' : 'false';
      });
      node = el('label', { class: 'switch' }, [checkbox, el('i'), labelText]);
      node._checkbox = checkbox;
    } else if (prop.type === 'number' || prop.type === 'integer') {
      kind = 'number';
      node = el('input', {
        class: 'input',
        id: controlId,
        type: 'number',
        step: prop.type === 'integer' ? '1' : 'any',
        placeholder: entry.required ? '必填' : '选填'
      });
    } else if (prop.type === 'array' || prop.type === 'object' || prop.anyOf) {
      kind = 'json';
      node = el('textarea', {
        class: 'textarea',
        id: controlId,
        placeholder: prop.type === 'array' ? '["a", "b"]' : '{"key": "value"}'
      });
    } else {
      node = el('input', {
        class: 'input',
        id: controlId,
        type: 'text',
        placeholder: entry.required ? '必填' : '选填'
      });
    }

    wrapper.appendChild(node);
    if (prop.description) wrapper.appendChild(el('div', { class: 'desc', text: prop.description }));
    if (prop.type === 'array' || prop.type === 'object') {
      wrapper.appendChild(el('div', { class: 'hint', text: '请填写合法 JSON' }));
    }
    wrapper.appendChild(el('div', { class: 'form-error' }));
    return { entry: entry, node: wrapper, kind: kind, control: node, required: entry.required };
  }

  function readField(field) {
    var entry = field.entry;
    var prop = entry.prop || {};
    if (field.kind === 'enum') {
      var value = field.control.value;
      if (!value) {
        if (entry.required) return { error: '该项为必填' };
        return { skip: true };
      }
      var matched = value;
      (prop.enum || []).forEach(function (item) {
        if (String(item) === value) matched = item;
      });
      return { value: matched };
    }
    if (field.kind === 'boolean') {
      return { value: !!(field.control._checkbox && field.control._checkbox.checked) };
    }
    if (field.kind === 'number') {
      var raw = field.control.value.trim();
      if (!raw) {
        if (entry.required) return { error: '该项为必填' };
        return { skip: true };
      }
      var number = Number(raw);
      if (!isFinite(number)) return { error: '请输入合法数字' };
      return { value: prop.type === 'integer' ? Math.trunc(number) : number };
    }
    if (field.kind === 'json') {
      var jsonText = field.control.value.trim();
      if (!jsonText) {
        if (entry.required) return { error: '该项为必填' };
        return { skip: true };
      }
      var parsed = parseJSONSafe(jsonText);
      if (!parsed.ok) return { error: 'JSON 解析失败：' + parsed.error.message };
      if (prop.type === 'array' && !Array.isArray(parsed.value)) return { error: '应为数组' };
      if (prop.type === 'object' && (Array.isArray(parsed.value) || typeof parsed.value !== 'object')) {
        return { error: '应为对象' };
      }
      return { value: parsed.value };
    }
    var textValue = field.control.value.trim();
    if (!textValue) {
      if (entry.required) return { error: '该项为必填' };
      return { skip: true };
    }
    return { value: textValue };
  }

  function setBusy(busy) {
    STORE.busy = !!busy;
    ['deltaBtn', 'reasoningDeltaBtn', 'replyBtn', 'claimBtn', 'rejectBtn'].forEach(function (id) {
      var button = document.getElementById(id);
      if (button) button.disabled = !!busy;
    });
  }

  function sendDelta(kind) {
    kind = kind === 'reasoning' ? 'reasoning' : 'text';
    var job = STORE.job;
    var input = document.getElementById(kind === 'reasoning' ? 'reasoningInput' : 'replyInput');
    if (!job || !input || STORE.busy) return;
    var value = input.value;
    if (!value.trim()) {
      toast(kind === 'reasoning' ? '先输入思考内容再发送' : '先输入内容再发送片段', 'err');
      return;
    }
    setBusy(true);
    api('/api/queue/' + encodeURIComponent(job.id) + '/delta', {
      method: 'POST',
      body: { text: value, kind: kind }
    }).then(function (data) {
      if (kind === 'reasoning') {
        STORE.draftReasoning = data.reply_reasoning || (STORE.draftReasoning + value);
      } else {
        STORE.draft = data.reply_text || (STORE.draft + value);
      }
      input.value = '';
      updateCharCount();
      toast(kind === 'reasoning' ? '思考片段已推送' : '回答片段已推送', 'ok');
      renderComposer();
      loadDetail(job.id, true);
    }).catch(function (error) {
      toast('发送失败：' + error.message, 'err');
    }).then(function () { setBusy(false); });
  }

  function sendReply() {
    var job = STORE.job;
    var input = document.getElementById('replyInput');
    var reasoningInput = document.getElementById('reasoningInput');
    if (!job || !input || STORE.busy) return;
    var full = (STORE.draft || '') + input.value;
    var reasoning = (STORE.draftReasoning || '') + (reasoningInput ? reasoningInput.value : '');
    if (!full.trim() && !reasoning.trim() && !STORE.toolCalls.length) {
      toast('内容为空：写点文字、思考内容或加入工具调用', 'err');
      return;
    }
    setBusy(true);
    api('/api/queue/' + encodeURIComponent(job.id) + '/reply', {
      method: 'POST',
      body: {
        text: full,
        reasoning: reasoning,
        tool_calls: STORE.toolCalls,
        finish_reason: STORE.toolCalls.length ? 'tool_calls' : undefined
      }
    }).then(function () {
      STORE.draft = '';
      STORE.draftReasoning = '';
      STORE.toolCalls = [];
      STORE.activeTool = null;
      input.value = '';
      if (reasoningInput) reasoningInput.value = '';
      UI.composerJobId = null;
      toast('已提交，客户端马上收到结果', 'ok');
      return refreshQueue();
    }).then(function () {
      return loadDetail(STORE.selectedId, true);
    }).catch(function (error) {
      toast('提交失败：' + error.message, 'err');

    });

  function claimJob() {
    var job = STORE.job;
    if (!job || STORE.busy) return;
    setBusy(true);
    api('/api/queue/' + encodeURIComponent(job.id) + '/claim', { method: 'POST' })
      .then(function () {

  function rejectJob() {
    var job = STORE.job;
    if (!job || STORE.busy) return;
    var button = document.getElementById('rejectBtn');
    if (!UI.rejectArmed) {
      UI.rejectArmed = true;
      if (button) {

  function modelsCard() {
    var config = STORE.config || {};
    var models = config.models || STORE.models || [];
    var list = el('div', { class: 'list-rows' });

    models.forEach(function (model) {
      var caps = model.capabilities || {};
      var capChips = el('div', { class: 'cap-grid' });
      Object.keys(CAP_LABELS).forEach(function (name) {
        if (caps[name]) capChips.appendChild(el('span', { class: 'cap on', text: CAP_LABELS[name] }));
      });
      var edit = el('button', { class: 'btn small ghost', type: 'button' }, [icon('gear', 14), '编辑']);
      edit.addEventListener('click', function () {
        UI.editModelId = model.id;
        renderView();
      });
      list.appendChild(el('div', { class: 'list-row' }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'title', text: model.id }),
          el('div', { class: 'meta', text: (model.label || '') + ' · 上下文 ' + (model.context_window || 0) + ' · 输出 ' + (model.max_output_tokens || 0) }),
          capChips
        ]),
        el('span', { class: 'mini-badge ' + (model.enabled === false ? 'red' : 'green'), text: model.enabled === false ? '停用' : '启用' }),
        edit
      ]));
    });

    var editing = null;
    models.forEach(function (model) { if (model.id === UI.editModelId) editing = model; });

    var idInput = textInput(editing ? editing.id : 'peo-human-custom', { placeholder: '模型 ID' });
    if (editing) idInput.readOnly = true;
    var labelInput = textInput(editing ? editing.label : '', { placeholder: '显示名称' });
    var descInput = textInput(editing ? editing.description : '', { placeholder: '一句话说明' });
    var contextInput = numberInput(editing ? editing.context_window : 32000, { min: 1024, max: 4000000 });
    var outputInput = numberInput(editing ? editing.max_output_tokens : 4096, { min: 1, max: 1000000 });
    var aliasInput = textInput(editing ? (editing.aliases || []).join(',') : '', { placeholder: '别名，逗号分隔，例如 gpt-4o' });
    var defaultsInput = el('textarea', { class: 'textarea', id: 'modelDefaults', placeholder: '{"temperature": 0.7}' });
    defaultsInput.value = fmtJSON((editing && editing.default_params) || { temperature: 0.7, top_p: 1.0 }, 2);
    var enabledCheck = el('input', { type: 'checkbox' });
    enabledCheck.checked = !editing || editing.enabled !== false;

    var capInputs = {};
    var capGrid = el('div', { class: 'form-grid' });
    Object.keys(CAP_LABELS).forEach(function (name) {
      var checkbox = el('input', { type: 'checkbox' });
      checkbox.checked = !!(editing && editing.capabilities && editing.capabilities[name]);
      capInputs[name] = checkbox;
      capGrid.appendChild(el('div', { class: 'field' }, [
        el('label', { class: 'switch' }, [checkbox, el('i'), el('span', { text: CAP_LABELS[name] })]),
        el('div', { class: 'desc', text: name === 'vision' ? '开启后自动解析并展示请求中的图片' : '' })
      ]));
    });

    var save = el('button', { class: 'btn primary small', type: 'button' }, [icon('check', 14), editing ? '保存修改' : '创建模型']);
    save.addEventListener('click', function () {
      var capabilities = {};
      Object.keys(capInputs).forEach(function (name) { capabilities[name] = capInputs[name].checked; });
      var defaultsParsed = parseJSONSafe(defaultsInput.value || '{}');
      if (!defaultsParsed.ok || typeof defaultsParsed.value !== 'object' || Array.isArray(defaultsParsed.value)) {
        toast('默认参数必须是 JSON 对象', 'err');
        return;
      }
      var payload = {
        id: idInput.value.trim(),
        default_params: defaultsParsed.value,
        label: labelInput.value.trim(),
        description: descInput.value.trim(),
        enabled: enabledCheck.checked,
        aliases: aliasInput.value.split(',').map(function (item) { return item.trim(); }).filter(Boolean),
        capabilities: capabilities,
        context_window: Number(contextInput.value) || 32000,
        max_output_tokens: Number(outputInput.value) || 4096
      };
      if (!payload.id) {
        toast('请填写模型 ID', 'err');
        return;
      }
      save.disabled = true;
      api('/api/admin/models', { method: 'POST', body: payload, admin: true })
        .then(function () {
          toast('模型已保存', 'ok');
          UI.editModelId = null;
          return loadConfig();
        })
        .then(renderView)
        .catch(function (error) { toast('保存失败：' + error.message, 'err'); })
        .then(function () { save.disabled = false; });
    });

    var deleteBtn = el('button', { class: 'btn small danger', type: 'button' }, [icon('trash', 14), '删除该模型']);
    var deleteArmed = false;
    deleteBtn.addEventListener('click', function () {
      if (!editing) return;
      if (!deleteArmed) {
        deleteArmed = true;
        deleteBtn.textContent = '确认删除？';
        window.setTimeout(function () { deleteArmed = false; deleteBtn.textContent = '删除该模型'; }, 3000);
        return;
      }
      api('/api/admin/models/' + encodeURIComponent(editing.id), { method: 'DELETE', admin: true })
        .then(function () {
          toast('模型已删除', 'ok');
          UI.editModelId = null;
          return loadConfig();
        })
        .then(renderView)
        .catch(function (error) { toast('删除失败：' + error.message, 'err'); });
    });

    var reset = el('button', { class: 'btn small ghost', type: 'button' }, ['新建模型']);
    reset.addEventListener('click', function () {
      UI.editModelId = null;
      renderView();
    });

    return card('模型与能力', '能力开关会直接约束 API：未开启图片的模型拒绝图片输入，未开启工具的模型拒绝 tools 参数。', [
      list,
      el('div', { class: 'section-title', style: 'margin-top:18px', text: editing ? '编辑模型 ' + editing.id : '新建模型' }),
      el('div', { class: 'form-grid' }, [
        fieldRow('模型 ID', idInput),
        fieldRow('显示名称', labelInput),
        fieldRow('说明', descInput),
        fieldRow('上下文窗口', contextInput),
        fieldRow('最大输出', outputInput),
        fieldRow('别名', aliasInput),
        el('div', { class: 'field' }, [
          el('label', { text: '默认参数（JSON）' }),
          defaultsInput,
          el('div', { class: 'desc', text: '客户端未传 temperature / top_p / max_tokens / stop 时自动补齐' })
        ]),
        el('div', { class: 'field' }, [
          el('label', { class: 'switch' }, [enabledCheck, el('i'), el('span', { text: '启用该模型' })])
        ])
      ]),
      el('div', { style: 'margin-top:14px' }, [capGrid]),
      el('div', { class: 'row-actions' }, [save, reset, editing ? deleteBtn : null])
    ]);
  }

  function sampleCode(kind) {
    var base = docsBase();
    if (kind === 'openai-curl') {
      return [
        'curl -N ' + base + '/v1/chat/completions \\',
        '  -H "Authorization: Bearer YOUR_API_KEY" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d ' + '\'{"model":"peo-human-1","stream":true,"messages":[{"role":"user","content":"你好，人类。"}]}\''
      ].join('\n');
    }
    if (kind === 'openai-python') {
      return [
        'from openai import OpenAI',
        '',
        'client = OpenAI(',
        '    base_url="' + base + '/v1",',
        '    api_key="YOUR_API_KEY",',
        ')',
        'resp = client.chat.completions.create(',
        '    model="peo-human-1",',
        '    messages=[{"role": "user", "content": "你好，人类。"}],',
        ')',
        'print(resp.choices[0].message.content)'
      ].join('\n');
    }
    if (kind === 'openai-image') {
      return [
        'python - <<PY',
        'import base64, pathlib',
        'from openai import OpenAI',
        '',
        'image = base64.b64encode(pathlib.Path("shot.png").read_bytes()).decode()',
        'client = OpenAI(base_url="' + base + '/v1", api_key="YOUR_API_KEY")',
        'resp = client.chat.completions.create(',
        '    model="peo-human-vision",',
        '    messages=[{"role": "user", "content": [',
        '        {"type": "text", "text": "这张截图里有什么问题？"},',
        '        {"type": "image_url", "image_url": {"url": "data:image/png;base64," + image}},',
        '    ]}],',
        ')',
        'print(resp.choices[0].message.content)',
        'PY'
      ].join('\n');
    }
    if (kind === 'agent-tools') {
      return [
        'tools = [{',
        '  "type": "function",',
        '  "function": {',
        '    "name": "run_sql",',
        '    "description": "在只读副本上执行 SQL",',
        '    "parameters": {',
        '      "type": "object",',
        '      "properties": {',
        '        "sql": {"type": "string", "description": "要执行的查询"},',
        '        "limit": {"type": "integer", "description": "返回行数上限"}',
        '      },',
        '      "required": ["sql"]',
        '    }',
        '  }',
        '}]',
        '',
        'resp = client.chat.completions.create(',
        '    model="peo-human-code",',
        '    messages=[{"role": "user", "content": "统计昨天的订单量"}],',
        '    tools=tools, tool_choice="auto",',
        ')',
        'call = resp.choices[0].message.tool_calls[0]',
        'print(call.function.name, call.function.arguments)'
      ].join('\n');
    }
    if (kind === 'anthropic') {
      return [
        'from anthropic import Anthropic',
        '',
        'client = Anthropic(',
        '    base_url="' + base + '",',
        '    api_key="YOUR_API_KEY",',
        ')',
        'msg = client.messages.create(',
        '    model="peo-human-1",',
        '    max_tokens=1024,',
        '    messages=[{"role": "user", "content": "写一句欢迎语"}],',
        ')',
        'print(msg.content[0].text)'
      ].join('\n');
    }
    if (kind === 'gemini') {
      return [
        'curl ' + base + '/v1beta/models/peo-human-1:generateContent \\',
        '  -H "x-goog-api-key: YOUR_API_KEY" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d ' + '\'{"contents":[{"role":"user","parts":[{"text":"你好"}]}],"generationConfig":{"temperature":0.4}}\''
      ].join('\n');
    }
    if (kind === 'ollama') {
      return [
        'curl ' + base + '/api/chat \\',
        '  -H "Authorization: Bearer YOUR_API_KEY" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d ' + '\'{"model":"peo-human-mini","stream":false,"messages":[{"role":"user","content":"你好"}]}\''
      ].join('\n');
    }
    return '';
  }

      '请求图片只接受白名单 MIME，并校验文件魔数；单图与单请求大小受限。',
      '远端图片默认不在浏览器加载，避免通过图片请求泄漏操作员出口 IP。',
      '操作员会话使用 Bearer 令牌，不使用 Cookie，天然免疫 CSRF；登录失败按 IP 锁定。',
      '服务端不抓取任何外部 URL，避免 SSRF；前端渲染全部走 DOM 节点，不使用 innerHTML。',
      '请求内容会落盘到 data/requests/ 便于审计，请为磁盘做好权限与备份策略。'
    ];
    return card('安全说明', '上线前请逐条确认。', [
      el('ul', { class: 'list-rows' }, items.map(function (item) {
        return el('div', { class: 'list-row' }, [
          icon('shield', 16),
          el('div', { class: 'grow' }, [el('div', { class: 'meta', text: item })])
        ]);
      }))
    ]);
  }

  /* ======================================================================
     初始化
     ====================================================================== */
  function paintStaticIcons() {
    var brand = document.getElementById('brandMark');
    if (brand) { clear(brand); brand.appendChild(icon('logo', 22)); }
    var loginMark = document.getElementById('loginMark');
    if (loginMark) { clear(loginMark); loginMark.appendChild(icon('logo', 26)); }
    var themeBtn = document.getElementById('themeBtn');
    if (themeBtn) { clear(themeBtn); themeBtn.appendChild(icon(STORE.theme === 'dark' ? 'sun' : 'moon', 18)); }
    var refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) { clear(refreshBtn); refreshBtn.appendChild(icon('refresh', 18)); }
    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) { clear(logoutBtn); logoutBtn.appendChild(icon('logout', 18)); }
    var lightboxClose = document.getElementById('lightboxClose');
    if (lightboxClose) { clear(lightboxClose); lightboxClose.appendChild(icon('x', 18)); }
  }

  function bindTopbar() {
    var tabs = document.querySelectorAll('#viewTabs .tab');
    Array.prototype.forEach.call(tabs, function (tab) {
      tab.addEventListener('click', function () { setView(tab.dataset.view); });
    });
    document.getElementById('themeBtn').addEventListener('click', toggleTheme);
    document.getElementById('refreshBtn').addEventListener('click', function () {
      refreshQueue().then(function () { toast('队列已刷新', 'info'); });
      if (STORE.selectedId) loadDetail(STORE.selectedId, true);
    });
    document.getElementById('logoutBtn').addEventListener('click', function () {
      api('/api/operator/logout', { method: 'POST' }).catch(function () { /* 忽略 */ });
      STORE.token = '';
      STORE.job = null;
      STORE.selectedId = null;
      STORE.draft = '';
      STORE.toolCalls = [];
      localStorage.removeItem('peoai_token');
      if (STORE.eventAbort) {
        try { STORE.eventAbort.abort(); } catch (e) { /* 忽略 */ }
        STORE.eventAbort = null;
      }
      stopPolling();
      setConnected(false);
      showLogin('已退出登录');
    });
  }

  function bindLogin() {
    var form = document.getElementById('loginForm');
    var errorNode = document.getElementById('loginError');
    var submit = document.getElementById('loginSubmit');
    var passwordInput = document.getElementById('loginPassword');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var password = passwordInput.value;
      var base = (STORE.base || detectBase()).trim().replace(/\/+$/, '');
      if (!password) {
        errorNode.textContent = '请输入密码';
        return;
      }
      if (!/^https?:\/\//.test(base)) {
        errorNode.textContent = 'API 地址需要以 http:// 或 https:// 开头';
        return;
      }
      STORE.base = base;
      submit.disabled = true;
      errorNode.textContent = '';
      fetch(base + '/api/operator/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
      }).then(function (response) {
        return response.text().then(function (raw) {
          var data = null;
          try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
          if (!response.ok) {
            var message = (data && data.error && data.error.message) || ('HTTP ' + response.status);
            var failure = new Error(message);
            failure.status = response.status;
            throw failure;
          }
          return data;
        });
      }).then(function (data) {
        STORE.token = data.token;
        STORE.operatorName = data.name || '操作员';
        localStorage.setItem('peoai_token', data.token);
        passwordInput.value = '';
        enterApp({ name: data.name, server: { version: STORE.version } });
        toast('欢迎回来，' + STORE.operatorName, 'ok');
      }).catch(function (error) {
        var message = (error && error.message) ? error.message : '登录失败';
        if (!error || !error.status) {
          message = '无法连接 ' + base + '：请确认该地址可访问、Nginx 已反代 /peoai/，并且服务端 CORS 允许本页来源';
        }
        errorNode.textContent = message;
      }).then(function () {
        submit.disabled = false;
      });
    });
  }

  function bindLightbox() {
    var overlay = document.getElementById('lightbox');
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    overlay.addEventListener('click', function (event) {
      if (event.target === overlay) closeLightbox();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        if (overlay.classList.contains('is-open')) closeLightbox();
      }
    });
  }

  var booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    var savedTheme = localStorage.getItem('peoai_theme') || localStorage.getItem('site_theme') || 'light';
    applyTheme(savedTheme);
    STORE.base = detectBase();
    STORE.token = localStorage.getItem('peoai_token') || '';
    paintStaticIcons();
    bindTopbar();
    bindLogin();
    bindLightbox();
    updateTopbar();
    refineBase();

    if (STORE.token) {
      api('/api/operator/me').then(function (info) {
        enterApp(info);
      }).catch(function (error) {
        if (error.status === 401) showLogin('会话已过期，请重新登录');
        else showLogin('无法连接服务：' + error.message);
      });
    } else {
      showLogin('');
    }
  }

  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    boot();
  }

})();
</script>
</body>
</html>
